[project]
name = "geoloc"
version = "0.1.0"
description = "Local-only single-image geolocation workbench for OSINT practitioners"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "exifread>=3.0",
    "geonamescache>=2.0",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
]
app = [
    "pywebview>=5.0; sys_platform == 'darwin'",
    "pyinstaller>=6.10",
]
ocr = [
    "pyobjc-framework-Vision>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
geoloc = "geoloc.cli:app"
geoloc-desktop = "geoloc.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoloc"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/geoloc/web/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter, not enforced here
    "B008",    # FastAPI's Depends/File/Form idiom requires calls in defaults
    "RUF012",  # pydantic/dataclass mutable defaults are handled by Field()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests import lazily inside functions on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
